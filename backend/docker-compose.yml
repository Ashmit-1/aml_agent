services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluxguard-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - auth-db-data:/data
      - ./backend/app/data:/app/app/data
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - DATABASE_URL=/data/auth.db
      - SESSION_EXPIRY_DAYS=${SESSION_EXPIRY_DAYS:-7}
    command: >
      sh -c "
        if [ ! -f /app/app/data/SAML-D.csv ]; then
          echo 'Downloading dataset...' &&
          curl -L -o /tmp/SAML-D.zip https://www.kaggle.com/api/v1/datasets/download/berkanoztas/synthetic-transaction-monitoring-dataset-aml &&
          unzip -o /tmp/SAML-D.zip -d /app/app/data/ &&
          find /app/app/data -name '*.csv' -exec mv {} /app/app/data/SAML-D.csv \; 2>/dev/null || true &&
          rm /tmp/SAML-D.zip
        fi &&
        uvicorn app.api:app --host 0.0.0.0 --port 8001 --workers 4
      "